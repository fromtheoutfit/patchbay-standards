# patchbay-standards: the base index. Format and the two-index relation are the rule in
# base/process/standards-index.md; scripts/check-index.sh (gate step 3) holds this file equal to
# the tracked files under base/, and holds agent-os/standards/index.yml to be a symlink to it.
#
# One `base:` section, keyed by each standard's path relative to base/ without the .md. A
# description says what the standard DECIDES, not what area it belongs to, and holds no `: `.
base:
  process/ownership:
    description: A person owns every commit, pull request, approval and merge; an agent never lands work, and a system-wide tool is asked for before it is installed
  process/standards-index:
    description: Two-level index keyed by path relative to its section without the .md, one description line saying what the standard decides, every standard indexed and nothing else, and a consuming project's base section replaced whole by the sync at the pinned commit and never edited by hand
  process/standards-retrospective:
    description: The last step of every gate asks four questions of the diff, verifies a rewritten standard against shipped code, proposes a base change instead of editing it in place, and keeps every standards edit approved by a person
  process/standards-sync:
    description: A consuming project takes base/ whole from one commit of patchbay-standards by scripts/sync-standards.sh, origin's default branch unless a ref is named and never the working tree, pins it in .version, holds the copy and its base section byte-identical to that commit with --check as a gate step, regenerates the base section alone with --index-only, syncs forward deliberately in its own change set, and has its CI check the sibling out at the pin read from .version
  process/verification-gate:
    description: One scripts/gate.sh runs every runnable step in a fixed order, exits 1 at the first failure after naming it and 2 on usage, lists files with git, then Docs, Version and the retrospective as judgment; tool pins in the script, rules in a versioned config, CI runs the same script and nothing else with every action pinned to a commit, every step proven to fail by a negative test that asserts its status, and the gate's files changed only in their own spec
