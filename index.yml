# patchbay-standards: the base index. Format and the two-index relation are the rule in
# base/process/standards-index.md; scripts/check-index.sh (gate step 3) holds this file equal to
# the tracked files under base/, and holds agent-os/standards/index.yml to be a symlink to it.
#
# One `base:` section, keyed by each standard's path relative to base/ without the .md. A
# description says what the standard DECIDES, not what area it belongs to, and holds no `: `.
base:
  process/ownership:
    description: A person owns every commit, pull request, approval and merge; an agent never lands work, and a system-wide tool is asked for before it is installed
  process/standards-index:
    description: Two-level index keyed by path relative to its section without the .md, one description line saying what the standard decides, every standard indexed and nothing else, and a consuming project's base section replaced whole by the sync at the pinned commit and never edited by hand
  process/standards-retrospective:
    description: The last step of every gate asks four questions of the diff, verifies a rewritten standard against shipped code, proposes a base change instead of editing it in place, and keeps every standards edit approved by a person
  process/standards-sync:
    description: A consuming project takes base/ whole from one commit of patchbay-standards by scripts/sync-standards.sh, origin's default branch unless a ref is named and never the working tree, pins it in .version, holds the copy and its base section byte-identical to that commit with --check as a gate step, regenerates the base section alone with --index-only, syncs forward deliberately in its own change set, and has its CI check the sibling out at the pin read from .version
  process/verification-gate:
    description: One scripts/gate.sh runs every runnable step in a fixed order, exits 1 at the first failure after naming it and 2 when not run as the gate, reads the files git lists at the repository root, and fails a step's install of its pinned tools as itself before any tool checks the tree, then Docs, Version and the retrospective as judgment; each tool pinned exactly in one place, the script when there is no package manifest and otherwise the manifest resolved in a lockfile the gate runs locked, the runner pinned in the manifest where it can be, rules in a versioned config or the manifest's tool sections, CI runs the same script and checks nothing it does not, after installing the runner and any locked toolchain, with every action pinned to a commit and a cache only on a lockfile key, every step proven to fail by a negative test that asserts its status, its reason and no later step reached, a rule set by a changed value and an unparsable value and file, a pin by a version that cannot install, a consuming project's script on this repository's skeleton, and the gate's files, its tool pins among them, changed only in their own spec
  python/toolchain:
    description: One tool per job in a uv Python package (uv, ruff, mypy, pytest with hypothesis, pre-commit), configured only in pyproject.toml with .pre-commit-config.yaml the one hook file beside it, uv_build in the range uv init writes floored at the pinned uv, license-files stated, the 3.12 floor stated in four places, ruff selecting ALL with an ignore list the tree taught and coded noqa only, mypy strict over src and tests, pytest with strict markers and config, ruff-only local hooks through uv run --locked, and the gate's tool steps in the order format, lint, types, tests; pins, locking and CI stay the gate standard's
