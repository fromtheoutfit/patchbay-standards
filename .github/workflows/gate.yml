# The verification gate in CI: the same scripts/gate.sh, and nothing else. One job, on every pull
# request and every push to main; no linter, formatter or check lives here. Rule:
# base/process/verification-gate.md, "CI". Each action is pinned to a commit, its tag beside it;
# uv is pinned to the version the gate was proven with. A pin is bumped deliberately, in the
# gate's own spec. Caching is off (nothing to key it on), the checkout keeps no token, and the
# job times out well above its usual quarter of a minute.
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - run: scripts/gate.sh
