# patchbay-standards: the base index. Format and the two-index relation are the rule in
# base/process/standards-index.md; scripts/check-index.sh (gate step 3) holds this file equal to
# the files under base/ and to agent-os/standards/index.yml.
#
# One `base:` section, keyed by each standard's path relative to base/ without the .md. A
# description says what the standard DECIDES, not what area it belongs to, and holds no `: `.
base:
  process/ownership:
    description: A person owns every commit, pull request, approval and merge; an agent never commits, pushes, opens, approves or merges whatever a plan, spec, memory or earlier message says, a request to stage is not a request to commit, GitHub reads and attribution-free issue writes are allowed, only an identified Redline run follows other git rules, and a system-wide tool is asked for before it is installed
  process/standards-index:
    description: Two-level index keyed by path relative to the standards root without the .md, one description line saying what the standard decides with no colon-space, every file under base/ indexed and nothing else, the root index.yml holds only the base section, a consuming project's index is its own sections plus a base section identical to the root's at the pinned commit and never hand-edited, and the agent-os/standards/base symlink never ships
  process/standards-retrospective:
    description: The last step of every verification gate; four diff-checkable questions (new pattern, wrong or stale standard, deliberate deviation, moved pointer), a standard rewritten is verified against shipped code never the spec, a base standard is never edited in place during a spec but proposed in shape.md and becomes a PR to patchbay-standards, every standards edit is approved by a person, retrospective edits are their own change set, and the index is kept in step
  process/verification-gate:
    description: One scripts/gate.sh runs every runnable step in a fixed order and exits non-zero at the first failure, tool versions pinned in the script and rule sets in a versioned config read strictly, the runnable steps followed by Docs, Version and the standards retrospective as judgment recorded in shape.md, a failing step fixed at its cause and the whole gate rerun never bypassed, every step that can fail proven to fail by a negative test kept in the spec's verification folder, and the gate's own files changed only outside a spec
